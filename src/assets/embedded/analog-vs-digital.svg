<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Analog and Digital Signals</title>
  <desc id="desc">A smooth continuous analog waveform above a digital square wave alternating between low and high voltage.</desc>
  <rect width="760" height="400" fill="#ffffff"/>

  <!-- Analog: five complete cycles, with space on all sides -->
  <path d="M 68 100 C 90 53, 111 53, 133 100 S 176 147, 198 100 S 241 53, 263 100 S 306 147, 328 100 S 371 53, 393 100 S 436 147, 458 100 S 501 53, 523 100 S 566 147, 588 100 S 631 53, 653 100 S 696 147, 718 100"
        fill="none" stroke="#222222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="175" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#222222">Analog Signal</text>

  <line x1="68" y1="202" x2="718" y2="202" stroke="#e9e9e9" stroke-width="1"/>

  <!-- Digital: full rectangular pulses, no cropped edges -->
  <path d="M 68 324 H 88 V 245 H 148 V 324 H 208 V 245 H 268 V 324 H 328 V 245 H 388 V 324 H 448 V 245 H 508 V 324 H 568 V 245 H 628 V 324 H 718"
        fill="none" stroke="#222222" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="380" y="369" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" fill="#222222">Digital Signal</text>
</svg>
